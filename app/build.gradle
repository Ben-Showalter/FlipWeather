apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.flipweather.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.flipweather.app"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"

        // Optional Mapbox token for the radar base map - put
        // MAPBOX_TOKEN=pk.... in local.properties (not checked in).
        // Left empty, the radar falls back to CARTO's free dark map.
        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
        buildConfigField "String", "MAPBOX_TOKEN", "\"${localProps.getProperty("MAPBOX_TOKEN", "")}\""
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Sideloaded from GitHub Releases, not Google Play: Play's minimum
        // targetSdk doesn't apply, and targetSdk 28 suits the Android 7-10
        // flip phones this runs on. Without this, release builds stop in
        // lintVitalRelease with ExpiredTargetSdkVersion.
        disable 'ExpiredTargetSdkVersion'
    }

    // Release signing key, kept out of git: a `keystore.properties` at the repo
    // root (see CONTRIBUTING.md, "Publishing a release"). Without it, release
    // builds are left unsigned so fresh checkouts still build.
    def keystoreFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // Every published release must be signed with this same key, and
            // carry a higher versionCode, or phones refuse the in-app update.
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
}
